spring.application.name=lab
server.compression.enabled=false
server.compression.mime-types=application/json
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:6432/labdb?prepareThreshold=0
#spring.datasource.url=jdbc:postgresql://192.168.56.101:6432/labdb?prepareThreshold=0
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


#logging.level.org.springframework.context=DEBUG
#logging.level.org.springframework.web=DEBUG
#logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

#debug=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.url=jdbc:postgresql://localhost:6432/labdb?prepareThreshold=0
spring.flyway.user=postgres
spring.flyway.password=123
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10

# Habilita log DEBUG do Hikari
#logging.level.com.zaxxer.hikari.pool.HikariPool=DEBUG
#logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
# Grava em arquivo
# logging.file.name=logs/app.log
management.endpoints.web.exposure.include=*



logging.level.org.springframework.web.servlet.mvc.support=ERROR