services:
  db:
    image: postgres:17
    container_name: postgres_lab
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: labdb
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth=md5"	  
    ports:
      - "5432:5432"
    networks:
      - lab-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user", "-d", "labdb"]
      interval: 5s
      timeout: 5s
      retries: 5
  pgbouncer:
      image: edoburu/pgbouncer:latest
      container_name: pgbouncer_lab
      restart: always
      environment:
        - DB_HOST=db
        - DB_PORT=5432
        - DB_USER=user
        - DB_PASSWORD=password
        - DB_NAME=labdb
        - POOL_MODE=transaction
        - MAX_CLIENT_CONN=1000
        - DEFAULT_POOL_SIZE=25
        - RESERVE_POOL_SIZE=10
        - ADMIN_USERS=user
        - LISTEN_PORT=6432		
        - IGNORE_STARTUP_PARAMETERS=extra_float_digits
      ports:
        - "6432:6432"
      networks:
        - lab-network
      depends_on:
        db:
          condition: service_healthy
  rabbitmq:
      image: rabbitmq:3-management
      container_name: rabbitmq_lab
      restart: always
      ports:
        - "5672:5672"
        - "15672:15672"
      networks:
        - lab-network
      environment:
        RABBITMQ_DEFAULT_USER: guest
        RABBITMQ_DEFAULT_PASS: guest
      healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
        interval: 5s
        timeout: 5s
        retries: 5  
networks:
  lab-network:
    driver: bridge

volumes:
  postgres_data: